<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FitTracker PWA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTracker">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --card-opacity: 0.85;
      --card-blur: 12px;
      --bg-overlay: rgba(15, 23, 42, 0.85);
      --bg-image: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      position: relative;
    }

    #app-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
    }

    #app-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      background: var(--bg-overlay);
    }

    .glass-card {
      background: rgba(30, 41, 59, var(--card-opacity)) !important;
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Margen superior para evitar el notch / reloj / batería del iPhone */
    .header-safe {
      padding-top: max(env(safe-area-inset-top), 2.5rem);
    }

    /* Margen inferior para no solapar la barra de navegación */
    .pb-safe { 
      padding-bottom: max(calc(env(safe-area-inset-bottom) + 6rem), 6.5rem); 
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="antialiased">

  <div id="app-bg"></div>
  <div id="app-overlay"></div>

  <!-- Contenedor Principal -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative pb-safe">
    
    <!-- Cabecera ajustada hacia abajo -->
    <header class="p-4 header-safe flex justify-between items-center glass-card rounded-b-2xl mb-4 sticky top-0 z-30">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FitTracker</h1>
        <p id="current-date" class="text-xs text-slate-400 capitalize"></p>
      </div>
      <button type="button" onclick="toggleSettingsModal()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-slate-300 hover:text-white active:scale-95 transition">
        <i class="fa-solid font-bold fa-palette text-indigo-400"></i>
      </button>
    </header>

    <!-- Vista 1: Suplementos -->
    <main id="view-supplements" class="tab-view px-4 space-y-4">
      <div class="glass-card p-4 rounded-2xl">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-lg flex items-center gap-2"><i class="fa-solid fa-pills text-indigo-400"></i> Suplementos</h2>
          <button type="button" onclick="openAddSuppModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Añadir
          </button>
        </div>
        <p class="text-xs text-slate-400 mb-4">Marca las tomas programadas para hoy.</p>
        <div id="supplements-list" class="space-y-2"></div>
      </div>
    </main>

    <!-- Vista 2: Gimnasio -->
    <main id="view-gym" class="tab-view px-4 space-y-4 hidden">
      <div class="glass-card p-4 rounded-2xl">
        <h2 class="font-semibold text-lg flex items-center gap-2 mb-3"><i class="fa-solid fa-dumbbell text-emerald-400"></i> Registrar Ejercicio</h2>
        
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Grupo Muscular</label>
            <select id="gym-category" onchange="updateExerciseOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
              <option value="pecho">Pecho</option>
              <option value="espalda">Espalda</option>
              <option value="piernas">Pier
