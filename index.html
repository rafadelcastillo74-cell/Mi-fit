<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FitTracker PWA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTracker">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    /* Margen superior para bajar los botones y el título debajo del reloj/batería */
    .top-notch-space {
      padding-top: max(env(safe-area-inset-top), 48px) !important;
    }

    .pb-safe { 
      padding-bottom: calc(env(safe-area-inset-bottom) + 5rem); 
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="antialiased">

  <!-- Contenedor Principal -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative pb-safe">
    
    <!-- Cabecera separada con margen extra arriba -->
    <header class="px-4 pb-4 top-notch-space flex justify-between items-center glass-card rounded-b-2xl mb-4 sticky top-0 z-30">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FitTracker</h1>
        <p id="current-date" class="text-xs text-slate-400 capitalize"></p>
      </div>
    </header>

    <!-- Vista 1: Suplementos -->
    <main id="view-supplements" class="tab-view px-4 space-y-4">
      <div class="glass-card p-4 rounded-2xl">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-lg flex items-center gap-2"><i class="fa-solid fa-pills text-indigo-400"></i> Suplementos</h2>
          <button onclick="openAddSuppModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Añadir
          </button>
        </div>
        <p class="text-xs text-slate-400 mb-4">Marca las tomas programadas para hoy.</p>
        <div id="supplements-list" class="space-y-2"></div>
      </div>
    </main>

    <!-- Vista 2: Gimnasio -->
    <main id="view-gym" class="tab-view px-4 space-y-4 hidden">
      <div class="glass-card p-4 rounded-2xl">
        <h2 class="font-semibold text-lg flex items-center gap-2 mb-3"><i class="fa-solid fa-dumbbell text-emerald-400"></i> Registrar Ejercicio</h2>
        
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Grupo Muscular</label>
            <select id="gym-category" onchange="updateExerciseOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none">
              <option value="pecho">Pecho</option>
              <option value="espalda">Espalda</option>
              <option value="piernas">Piernas</option>
              <option value="hombros">Hombros</option>
              <option value="brazos">Brazos (Biceps/Triceps)</option>
              <option value="core">Core / Abdomen</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Ejercicio</label>
            <select id="gym-exercise" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none"></select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400 block mb-1">Series</label>
              <input type="number" id="gym-sets" value="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">Repeticiones</label>
              <input type="number" id="gym-reps" value="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none">
            </div>
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Peso (kg)</label
