<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FitTracker PWA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitTracker">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --card-opacity: 0.85;
      --card-blur: 12px;
      --bg-overlay: rgba(15, 23, 42, 0.85);
      --bg-image: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      position: relative;
    }

    #app-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
    }

    #app-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      background: var(--bg-overlay);
    }

    .glass-card {
      background: rgba(30, 41, 59, var(--card-opacity)) !important;
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.95) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Ajuste de margen superior para librar la Isla Dinámica y Batería del iPhone */
    .header-safe {
      padding-top: calc(env(safe-area-inset-top) + 2.8rem) !important;
    }

    /* Margen inferior para que la barra de navegación no tape el contenido */
    .pb-safe { 
      padding-bottom: calc(env(safe-area-inset-bottom) + 6rem) !important; 
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="antialiased">

  <div id="app-bg"></div>
  <div id="app-overlay"></div>

  <!-- Contenedor Principal -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative pb-safe">
    
    <!-- Cabecera Bajada para evitar solapamiento -->
    <header class="px-4 pb-4 header-safe flex justify-between items-center glass-card rounded-b-2xl mb-4 sticky top-0 z-30">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FitTracker</h1>
        <p id="current-date" class="text-xs text-slate-400 capitalize"></p>
      </div>
      <button type="button" onclick="toggleSettingsModal()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-slate-300 hover:text-white active:scale-95 transition">
        <i class="fa-solid font-bold fa-palette text-indigo-400"></i>
      </button>
    </header>

    <!-- Vista 1: Suplementos -->
    <main id="view-supplements" class="tab-view px-4 space-y-4">
      <div class="glass-card p-4 rounded-2xl">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-lg flex items-center gap-2"><i class="fa-solid fa-pills text-indigo-400"></i> Suplementos</h2>
          <button type="button" onclick="openAddSuppModal()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Añadir
          </button>
        </div>
        <p class="text-xs text-slate-400 mb-4">Marca las tomas programadas para hoy.</p>
        <div id="supplements-list" class="space-y-2"></div>
      </div>
    </main>

    <!-- Vista 2: Gimnasio -->
    <main id="view-gym" class="tab-view px-4 space-y-4 hidden">
      <div class="glass-card p-4 rounded-2xl">
        <h2 class="font-semibold text-lg flex items-center gap-2 mb-3"><i class="fa-solid fa-dumbbell text-emerald-400"></i> Registrar Ejercicio</h2>
        
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Grupo Muscular</label>
            <select id="gym-category" onchange="updateExerciseOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
              <option value="pecho">Pecho</option>
              <option value="espalda">Espalda</option>
              <option value="piernas">Piernas</option>
              <option value="hombros">Hombros</option>
              <option value="brazos">Brazos (Biceps/Triceps)</option>
              <option value="core">Core / Abdomen</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Ejercicio</label>
            <select id="gym-exercise" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200"></select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400 block mb-1">Series</label>
              <input type="number" id="gym-sets" value="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">Repeticiones</label>
              <input type="number" id="gym-reps" value="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
            </div>
          </div>

          <div>
            <label class="text-xs text-slate-400 block mb-1">Peso (kg)</label>
            <input type="number" id="gym-weight" placeholder="Ej: 60" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
          </div>

          <button type="button" onclick="saveWorkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition text-sm">
            Guardar Serie
          </button>
        </div>
      </div>

      <div class="glass-card p-4 rounded-2xl">
        <h3 class="font-semibold text-sm text-slate-300 mb-3">Entrenamiento de Hoy</h3>
        <div id="workout-log" class="space-y-2"></div>
      </div>
    </main>

    <!-- Vista 3: Actividad -->
    <main id="view-activity" class="tab-view px-4 space-y-4 hidden">
      <div class="glass-card p-4 rounded-2xl">
        <h2 class="font-semibold text-lg flex items-center gap-2 mb-3"><i class="fa-solid fa-shoe-prints text-cyan-400"></i> Pasos y Cardio</h2>
        
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Pasos de Hoy</label>
            <div class="flex gap-2">
              <input type="number" id="activity-steps" placeholder="Ej: 10000" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
              <button type="button" onclick="saveSteps()" class="bg-cyan-600 hover:bg-cyan-500 px-4 rounded-xl text-xs font-semibold transition">Guardar</button>
            </div>
          </div>
          
          <div class="pt-2">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span>Objetivo Diario</span>
              <span id="steps-progress-text">0 / 10.000</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
              <div id="steps-bar" class="bg-cyan-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sueño (Estilo Samsung Health 1-100) -->
      <div class="glass-card p-4 rounded-2xl">
        <h2 class="font-semibold text-lg flex items-center gap-2 mb-3"><i class="fa-solid fa-moon text-purple-400"></i> Control de Sueño</h2>
        
        <div class="space-y-4">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Horas Dormidas</label>
            <input type="number" step="0.5" id="sleep-hours" placeholder="Ej: 7.5" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none text-slate-200">
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs text-slate-400">Puntuación del Sueño (1 - 100)</label>
              <span id="sleep-score-badge" class="text-xs font-bold px-2 py-0.5 rounded-md bg-purple-900/60 text-purple-300">75 - Buena 🙂</span>
            </div>
            <input type="range" id="sleep-score-slider" min="1" max="100" value="75" oninput="updateSleepCategory(this.value)" class="w-full accent-purple-500">
          </div>

          <button type="button" onclick="saveSleep()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2.5 rounded-xl transition text-sm">
            Registrar Sueño
          </button>
        </div>
      </div>
    </main>

    <!-- Barra de Navegación Inferior Fija -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav rounded-t-2xl px-6 py-3 z-40 flex justify-around items-center">
      <button type="button" onclick="changeTab('supplements')" id="nav-supplements" class="flex flex-col items-center gap-1 text-indigo-400 cursor-pointer">
        <i class="fa-solid fa-pills text-lg pointer-events-none"></i>
        <span class="text-[10px] font-medium pointer-events-none">Suplementos</span>
      </button>
